<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sales Pipeline — Met Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/clients/assets/portal.css">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="admin-topbar">Met Capital — Internal</div>
  <header class="portal-header">
    <div class="header-inner">
      <a href="/admin/"><img src="/met_capital_logo.svg" alt="Met Capital" class="logo"></a>
      <nav class="portal-nav">
        <a href="/admin/">← All Apps</a>
        <a href="/admin/sales/" class="active">Sales Pipeline</a>
        <button class="logout" id="logoutBtn">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="page-label"><a href="/admin/">← All Apps</a></div>
    <h1 class="page-title">Sales Pipeline</h1>
    <p class="page-subtitle">Prospects from first contact to won or lost. Internal only — nothing here is client-visible, and nothing here sends any email.</p>

    <div id="pageAlert"></div>

    <div class="stat-cards" id="statCards">
      <div class="stat-card warn"><div class="stat-value" id="stActive">—</div><div class="stat-label">Active Leads</div></div>
      <div class="stat-card"><div class="stat-value" id="stWon">—</div><div class="stat-label">Won</div></div>
      <div class="stat-card"><div class="stat-value" id="stValue">—</div><div class="stat-label">Active Pipeline Value</div></div>
    </div>

    <div class="section-block">
      <h2 id="leadFormTitle">Add a Lead</h2>
      <div class="card">
        <form id="leadForm" novalidate>
          <input type="hidden" id="l_id">
          <div class="form-row">
            <div class="field"><label>Name <span class="required">*</span></label><input type="text" id="l_name" required></div>
            <div class="field"><label>Company</label><input type="text" id="l_company"></div>
            <div class="field"><label>Email</label><input type="email" id="l_email"></div>
            <div class="field"><label>Phone</label><input type="text" id="l_phone"></div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>Stage</label>
              <select id="l_stage">
                <option value="lead">Lead</option>
                <option value="contacted">Contacted</option>
                <option value="qualified">Qualified</option>
                <option value="proposal">Proposal</option>
                <option value="won">Won</option>
                <option value="lost">Lost</option>
              </select>
            </div>
            <div class="field"><label>Potential Value</label><input type="text" id="l_value" inputmode="decimal"></div>
            <div class="field">
              <label>Currency</label>
              <select id="l_currency">
                <option value="">—</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="CHF">CHF</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Notes</label><input type="text" id="l_notes"></div>
          <button type="submit" class="btn-small" id="leadSaveBtn">Save Lead</button>
          <button type="button" class="btn-small" id="leadCancelBtn" style="display:none;">Cancel Edit</button>
        </form>
      </div>
    </div>

    <div class="section-block">
      <h2>Pipeline</h2>
      <div class="card">
        <div id="leadsTable"><p style="color:var(--gray-light); font-size:0.875rem;">Loading…</p></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/clients/assets/supabase-config.js"></script>
  <script src="/admin/assets/admin.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', window.mcAdminLogout);

    var STAGE_META = {
      lead: { label: 'Lead', cls: 'neutral' },
      contacted: { label: 'Contacted', cls: 'info' },
      qualified: { label: 'Qualified', cls: 'info' },
      proposal: { label: 'Proposal', cls: 'pending' },
      won: { label: 'Won', cls: 'approved' },
      lost: { label: 'Lost', cls: 'rejected' }
    };
    var STAGE_ORDER = ['lead', 'contacted', 'qualified', 'proposal', 'won', 'lost'];

    function stagePill(stage) {
      var m = STAGE_META[stage] || { label: stage, cls: 'neutral' };
      return '<span class="status-pill ' + m.cls + '">' + m.label + '</span>';
    }

    function fmtValue(v, ccy) {
      if (v === null || v === undefined || v === '') return '—';
      try { return new Intl.NumberFormat('en-GB', ccy ? { style: 'currency', currency: ccy } : {}).format(v); }
      catch (e) { return v + (ccy ? ' ' + ccy : ''); }
    }

    function showAlert(message, type) {
      document.getElementById('pageAlert').innerHTML = '<div class="alert ' + type + '">' + message + '</div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadLeads() {
      var { data: rows, error } = await window.mcAdminClient
        .from('sales_leads').select('*').order('created_at', { ascending: false });

      var el = document.getElementById('leadsTable');
      if (error) {
        el.innerHTML = '<p style="color:var(--red); font-size:0.875rem;">Could not load leads: ' + error.message + '. Make sure migration 014 has been run.</p>';
        return;
      }

      var active = (rows || []).filter(function (r) { return r.stage !== 'won' && r.stage !== 'lost'; });
      document.getElementById('stActive').textContent = active.length;
      document.getElementById('stWon').textContent = (rows || []).filter(function (r) { return r.stage === 'won'; }).length;
      var totals = {};
      active.forEach(function (r) {
        if (r.value && r.currency) totals[r.currency] = (totals[r.currency] || 0) + parseFloat(r.value);
      });
      var parts = Object.keys(totals).map(function (c) { return fmtValue(totals[c], c); });
      document.getElementById('stValue').textContent = parts.length ? parts.join(' + ') : '—';

      if (!rows || rows.length === 0) {
        el.innerHTML = '<p style="color:var(--gray-light); font-size:0.875rem;">No leads yet.</p>';
        return;
      }

      rows.sort(function (a, b) { return STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage); });

      var html = '';
      rows.forEach(function (l) {
        html += '<tr>' +
          '<td>' + l.name + (l.company ? '<div style="font-size:0.75rem; color:var(--gray-light);">' + l.company + '</div>' : '') + '</td>' +
          '<td style="font-size:0.8125rem;">' + [l.email, l.phone].filter(Boolean).join('<br>') + '</td>' +
          '<td>' + stagePill(l.stage) + '</td>' +
          '<td>' + fmtValue(l.value, l.currency) + '</td>' +
          '<td style="font-size:0.8125rem; color:var(--gray);">' + (l.notes || '—') + '</td>' +
          '<td>' +
            '<button type="button" class="btn-small" data-edit=\'' + JSON.stringify(l).replace(/'/g, "&#39;") + '\'>Edit</button>' +
            '<button type="button" class="btn-small danger" data-del="' + l.id + '">Delete</button>' +
          '</td>' +
        '</tr>';
      });
      el.innerHTML = '<table class="admin-table"><thead><tr><th>Lead</th><th>Contact</th><th>Stage</th><th>Value</th><th>Notes</th><th></th></tr></thead><tbody>' + html + '</tbody></table>';

      el.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var l = JSON.parse(btn.getAttribute('data-edit'));
          document.getElementById('l_id').value = l.id;
          document.getElementById('l_name').value = l.name;
          document.getElementById('l_company').value = l.company || '';
          document.getElementById('l_email').value = l.email || '';
          document.getElementById('l_phone').value = l.phone || '';
          document.getElementById('l_stage').value = l.stage;
          document.getElementById('l_value').value = l.value ?? '';
          document.getElementById('l_currency').value = l.currency || '';
          document.getElementById('l_notes').value = l.notes || '';
          document.getElementById('leadFormTitle').textContent = 'Edit Lead';
          document.getElementById('leadCancelBtn').style.display = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      el.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (!confirm('Delete this lead?')) return;
          await window.mcAdminClient.from('sales_leads').delete().eq('id', btn.getAttribute('data-del'));
          loadLeads();
        });
      });
    }

    function resetLeadForm() {
      document.getElementById('leadForm').reset();
      document.getElementById('l_id').value = '';
      document.getElementById('leadFormTitle').textContent = 'Add a Lead';
      document.getElementById('leadCancelBtn').style.display = 'none';
    }
    document.getElementById('leadCancelBtn').addEventListener('click', resetLeadForm);

    document.getElementById('leadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var name = document.getElementById('l_name').value.trim();
      if (!name) { showAlert('Name is required.', 'error'); return; }

      var id = document.getElementById('l_id').value;
      var payload = {
        name: name,
        company: document.getElementById('l_company').value.trim() || null,
        email: document.getElementById('l_email').value.trim() || null,
        phone: document.getElementById('l_phone').value.trim() || null,
        stage: document.getElementById('l_stage').value,
        value: document.getElementById('l_value').value ? parseFloat(document.getElementById('l_value').value) : null,
        currency: document.getElementById('l_currency').value || null,
        notes: document.getElementById('l_notes').value.trim() || null,
        updated_at: new Date().toISOString()
      };

      var result = id
        ? await window.mcAdminClient.from('sales_leads').update(payload).eq('id', id)
        : await window.mcAdminClient.from('sales_leads').insert(payload);

      if (result.error) { showAlert('Could not save lead: ' + result.error.message, 'error'); return; }
      resetLeadForm();
      loadLeads();
    });

    (async function init() {
      var session = await window.mcRequireAdminSession('/admin/sales/');
      if (!session) return;
      if (!window.mcHasApp('sales')) {
        window.location.href = '/admin/?denied_app=sales';
        return;
      }
      loadLeads();
    })();
  </script>
</body>
</html>
