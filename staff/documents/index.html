<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Documents — Met Capital Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/clients/assets/portal.css">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <header class="portal-header">
    <div class="header-inner">
      <a href="/staff/"><img src="/met_capital_logo.svg" alt="Met Capital" class="logo"></a>
      <nav class="portal-nav">
        <a href="/staff/" class="dashboard-link">Dashboard</a>
        <a href="/staff/profile/">My Profile</a>
        <a href="/staff/vacation/">Time Off</a>
        <a href="/staff/documents/" class="active">Documents</a>
        <button class="logout" id="logoutBtn">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="page-label">Staff Portal</div>
    <h1 class="page-title">Documents</h1>
    <p class="page-subtitle">Documents HR has shared with you, and anything you upload for HR. Max 25MB per file.</p>

    <div id="pageAlert"></div>

    <div class="card" style="margin-bottom:1.5rem;">
      <h2 style="font-size:1rem; margin-bottom:0.75rem;">Upload a Document</h2>
      <form id="uploadForm" novalidate>
        <div class="inline-form-grid">
          <div class="field"><label>Title</label><input type="text" id="d_title" required></div>
          <div class="field">
            <label>Category</label>
            <select id="d_category">
              <option value="id">ID / Passport</option>
              <option value="certificate">Certificate / Diploma</option>
              <option value="contract">Contract</option>
              <option value="other" selected>Other</option>
            </select>
          </div>
          <div class="field"><label>File</label><input type="file" id="d_file" required></div>
        </div>
        <button type="submit" class="btn-small" id="uploadBtn">Upload</button>
      </form>
    </div>

    <div class="card"><div id="docsTable"><p style="color:var(--gray-light); font-size:0.875rem;">Loading…</p></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/clients/assets/supabase-config.js"></script>
  <script src="/staff/assets/staff-auth.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', window.mcStaffLogout);
    var mcSession = null;

    function showAlert(m, t) {
      document.getElementById('pageAlert').innerHTML = '<div class="alert ' + t + '">' + m + '</div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadDocs() {
      var { data: docs } = await window.mcStaff.from('employee_documents').select('*').eq('user_id', mcSession.user.id).order('uploaded_at', { ascending: false });
      var el = document.getElementById('docsTable');
      if (!docs || !docs.length) { el.innerHTML = '<p style="color:var(--gray-light); font-size:0.875rem;">No documents yet.</p>'; return; }
      var rows = '';
      docs.forEach(function (d) {
        rows += '<tr><td>' + d.title + '</td><td style="text-transform:capitalize;">' + d.category + '</td>' +
          '<td>' + (d.uploaded_by === 'hr' ? 'HR' : 'You') + '</td><td>' + new Date(d.uploaded_at).toLocaleDateString() + '</td>' +
          '<td><a href="#" data-view="' + d.storage_path + '">Download</a></td>' +
          '<td>' + (d.uploaded_by === 'employee' ? '<button type="button" class="btn-small danger" data-del="' + d.id + '" data-path="' + d.storage_path + '">Delete</button>' : '') + '</td></tr>';
      });
      el.innerHTML = '<table class="simple-table"><thead><tr><th>Title</th><th>Category</th><th>From</th><th>Date</th><th></th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
      el.querySelectorAll('[data-view]').forEach(function (a) {
        a.addEventListener('click', async function (e) {
          e.preventDefault();
          var { data, error } = await window.mcStaff.storage.from('employee-files').createSignedUrl(a.getAttribute('data-view'), 60);
          if (error || !data) { alert('Could not generate a link.'); return; }
          window.open(data.signedUrl, '_blank');
        });
      });
      el.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (!confirm('Delete this document?')) return;
          await window.mcStaff.storage.from('employee-files').remove([btn.getAttribute('data-path')]);
          await window.mcStaff.from('employee_documents').delete().eq('id', btn.getAttribute('data-del'));
          loadDocs();
        });
      });
    }

    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var file = document.getElementById('d_file').files[0];
      var title = document.getElementById('d_title').value.trim();
      if (!file || !title) { showAlert('Title and a file are required.', 'error'); return; }
      if (file.size > 25 * 1024 * 1024) { showAlert('File is too large (max 25MB).', 'error'); return; }
      var btn = document.getElementById('uploadBtn');
      btn.disabled = true; btn.textContent = 'Uploading…';
      try {
        var path = mcSession.user.id + '/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        var up = await window.mcStaff.storage.from('employee-files').upload(path, file);
        if (up.error) throw up.error;
        var ins = await window.mcStaff.from('employee_documents').insert({
          user_id: mcSession.user.id, title: title, category: document.getElementById('d_category').value, storage_path: path, uploaded_by: 'employee'
        });
        if (ins.error) throw ins.error;
        document.getElementById('uploadForm').reset();
        showAlert('Document uploaded.', 'success');
        loadDocs();
      } catch (err) {
        showAlert('Upload failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Upload';
      }
    });

    (async function init() {
      var session = await window.mcRequireStaffSession('/staff/documents/');
      if (!session) return;
      mcSession = session;
      loadDocs();
    })();
  </script>
</body>
</html>
