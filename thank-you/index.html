    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Thank You — Met Capital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --black: #000000;
            --gray-dark: #333333;
            --gray: #666666;
            --gray-light: #999999;
            --red: #C41E3A;
            --blue: #1E3A8A;
            --white: #FFFFFF;
            --off-white: #F7F7F7;
            --border: #E0E0E0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            color: var(--gray-dark);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { height: 26px; }

        nav { display: flex; align-items: center; gap: 2rem; }

        nav a {
            text-decoration: none;
            color: var(--gray);
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--black); }

        .confirm {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8rem 2rem 4rem;
        }

        .confirm-inner {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }

        .confirm-mark {
            width: 44px;
            height: 44px;
            border: 2px solid var(--blue);
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            font-size: 1.25rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--black);
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .confirm-inner p {
            font-size: 1rem;
            color: var(--gray);
            line-height: 1.75;
            margin-bottom: 2rem;
        }

        .confirm-inner a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .confirm-inner a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .header-inner { padding: 0.875rem 1.25rem; }
            .confirm { padding: 6rem 1.25rem 3rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/"><img src="/met_capital_logo.svg" alt="Met Capital" class="logo"></a>
            <nav>
                <a href="/#about">About</a>
                <a href="/#leadership">Leadership</a>
                <a href="/careers/">Careers</a>
                <a href="/contact/">Contact</a>
            </nav>
        </div>
    </header>

    <div class="confirm">
        <div class="confirm-inner">
            <div class="confirm-mark">✓</div>
            <h1>Message Received</h1>
            <p>Thank you for reaching out to Met Capital. We review submissions individually and will be in touch if appropriate. No automated reply will be sent.</p>
            <a href="/">← Back to met.capital</a>
        </div>
    </div>
</body>
</html>
