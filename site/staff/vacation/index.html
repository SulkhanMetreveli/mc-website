<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Time Off — Met Capital Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/clients/assets/portal.css">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <header class="portal-header">
    <div class="header-inner">
      <a href="/staff/"><img src="/met_capital_logo.svg" alt="Met Capital" class="logo"></a>
      <nav class="portal-nav">
        <a href="/staff/" class="dashboard-link">Dashboard</a>
        <a href="/staff/profile/">My Profile</a>
        <a href="/staff/vacation/" class="active">Time Off</a>
        <a href="/staff/documents/">Documents</a>
        <button class="logout" id="logoutBtn">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="page-label">Staff Portal</div>
    <h1 class="page-title" id="pageTitle">Time Off</h1>
    <p class="page-subtitle" id="pageSub">Requests go to HR for approval. Weekends are not counted. You can cancel a request while it's still pending.</p>

    <div id="pageAlert"></div>

    <div class="stat-cards" id="balanceCards">
      <div class="stat-card"><div class="stat-value" id="stRemaining">—</div><div class="stat-label">Vacation days remaining</div></div>
      <div class="stat-card"><div class="stat-value" id="stUsed">—</div><div class="stat-label">Used this year</div></div>
      <div class="stat-card"><div class="stat-value" id="stAllowance">—</div><div class="stat-label">Annual allowance</div></div>
    </div>

    <form id="requestForm" class="card" novalidate>
      <h2 style="font-size:1rem; margin-bottom:1rem;" id="formHeading">New Request</h2>
      <div class="form-row">
        <div class="field" id="typeField">
          <label for="type">Type <span class="required">*</span></label>
          <select id="type">
            <option value="vacation">Vacation</option>
            <option value="sick">Sick leave</option>
            <option value="unpaid">Unpaid leave</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field"><label for="start_date">From <span class="required">*</span></label><input type="date" id="start_date" required></div>
        <div class="field"><label for="end_date">To <span class="required">*</span></label><input type="date" id="end_date" required></div>
        <div class="field"><label>Working days</label><input type="text" id="daysPreview" readonly value="—"></div>
      </div>
      <div class="field"><label for="reason">Reason / note</label><input type="text" id="reason" placeholder="Optional"></div>
      <button type="submit" class="btn-primary" id="submitBtn">Submit Request</button>
    </form>

    <div class="section-block">
      <h2 id="historyHeading">My Requests</h2>
      <div class="card"><div id="history"><p style="color:var(--gray-light); font-size:0.875rem;">Loading…</p></div></div>
    </div>
  </main>

  <script src="/staff/assets/staff-auth.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', window.mcStaffLogout);

    var TYPE_LABELS = { vacation: 'Vacation', sick: 'Sick leave', unpaid: 'Unpaid leave', other: 'Other', absence: 'Absence' };
    var contractor = false;
    var todayIso = new Date().toISOString().slice(0, 10);
    var STATUS_CLS = { pending: 'pending', approved: 'approved', rejected: 'rejected', cancelled: 'neutral' };

    function showAlert(m, t) {
      document.getElementById('pageAlert').innerHTML = '<div class="alert ' + t + '">' + m + '</div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePreview() {
      var s = document.getElementById('start_date').value, e = document.getElementById('end_date').value;
      document.getElementById('daysPreview').value = (s && e) ? window.mcWorkingDays(s, e) : '—';
    }
    document.getElementById('start_date').addEventListener('change', updatePreview);
    document.getElementById('end_date').addEventListener('change', updatePreview);

    async function loadHistory() {
      var data = await window.mcStaffApi('/vacation');
      var reqs = data.requests || [];
      var bal = data.balance;
      if (bal) {
        document.getElementById('stRemaining').textContent = bal.remaining;
        document.getElementById('stUsed').textContent = bal.used;
        document.getElementById('stAllowance').textContent = bal.allowance;
      }

      var el = document.getElementById('history');
      if (!reqs.length) { el.innerHTML = '<p style="color:var(--gray-light); font-size:0.875rem;">' + (contractor ? 'No absence notices yet.' : 'No requests yet.') + '</p>'; return; }
      var rows = '';
      reqs.forEach(function (r) {
        rows += '<tr>' +
          '<td>' + (TYPE_LABELS[r.type] || r.type) + '</td>' +
          '<td>' + r.start_date + ' → ' + r.end_date + '</td>' +
          '<td>' + r.days + '</td>' +
          '<td><span class="status-pill ' + STATUS_CLS[r.status] + '">' + r.status + '</span>' + (r.reviewer_note ? '<div style="font-size:0.75rem; color:var(--gray-light);">' + r.reviewer_note + '</div>' : '') + '</td>' +
          '<td>' + ((contractor ? (r.status === 'approved' && r.start_date >= todayIso) : r.status === 'pending') ? '<button type="button" class="btn-small danger" data-cancel="' + r.id + '">' + (contractor ? 'Withdraw' : 'Cancel') + '</button>' : '') + '</td>' +
        '</tr>';
      });
      el.innerHTML = '<table class="simple-table"><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
      el.querySelectorAll('[data-cancel]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (!confirm(contractor ? 'Withdraw this absence notice?' : 'Cancel this request?')) return;
          try {
            await window.mcStaffApi('/vacation/' + btn.getAttribute('data-cancel') + '/cancel', { method: 'POST' });
            loadHistory();
          } catch (err) { showAlert('Could not cancel: ' + err.message, 'error'); }
        });
      });
    }

    document.getElementById('requestForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var s = document.getElementById('start_date').value, en = document.getElementById('end_date').value;
      if (!s || !en) { showAlert('Please choose both dates.', 'error'); return; }
      if (en < s) { showAlert('The end date must be on or after the start date.', 'error'); return; }
      var days = window.mcWorkingDays(s, en);
      if (days === 0) { showAlert('That range contains no working days.', 'error'); return; }
      var type = contractor ? 'absence' : document.getElementById('type').value;
      if (!contractor && type === 'vacation' && window.mcStaffBalance && days > window.mcStaffBalance.remaining &&
          !confirm('This exceeds your remaining vacation balance (' + window.mcStaffBalance.remaining + ' days). Submit anyway for HR to decide?')) return;

      var btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        await window.mcStaffApi('/vacation', { method: 'POST', body: { type: type, start_date: s, end_date: en, reason: document.getElementById('reason').value.trim() } });
        document.getElementById('requestForm').reset();
        updatePreview();
        showAlert(contractor ? 'Absence recorded. HR can see it immediately.' : 'Request submitted. HR will review it.', 'success');
        loadHistory();
      } catch (err) {
        showAlert('Could not submit: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Submit Request';
      }
    });

    (async function init() {
      var me = await window.mcRequireStaffSession('/staff/vacation/');
      if (!me) return;
      contractor = window.mcStaffIsContractor;
      if (contractor) {
        document.title = 'Availability — Met Capital Staff Portal';
        document.getElementById('pageTitle').textContent = 'Availability';
        document.getElementById('pageSub').textContent = 'As a contractor you don\'t accrue leave. Use this page to let HR know when you will be unavailable; notices are recorded immediately and can be withdrawn until they start.';
        document.getElementById('balanceCards').style.display = 'none';
        document.getElementById('typeField').style.display = 'none';
        document.getElementById('formHeading').textContent = 'New Absence Notice';
        document.getElementById('submitBtn').textContent = 'Record Absence';
        document.getElementById('historyHeading').textContent = 'My Absence Notices';
        document.querySelector('nav a.active').textContent = 'Availability';
      }
      loadHistory();
    })();
  </script>
</body>
</html>
