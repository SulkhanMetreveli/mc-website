<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Documents — Met Capital Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/clients/assets/portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="header-inner">
      <a href="/clients/"><img src="/met_capital_logo.svg" alt="Met Capital" class="logo"></a>
      <nav class="portal-nav">
        <a href="/clients/" class="dashboard-link">Dashboard</a>
        <a href="/clients/documents/" class="active">Documents</a>
        <a href="/clients/withdrawal/">Withdrawal Request</a>
        <a href="/clients/kyc/address-update/">Address &amp; Bank Update</a>
        <button class="logout" id="logoutBtn">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-main">
    <div class="page-label">Documents</div>
    <h1 class="page-title">Document Center</h1>
    <p class="page-subtitle">Statements, tax documents, and agreements shared with you by Met Capital.</p>

    <div style="margin-bottom:1.5rem; display:flex; gap:0.75rem; flex-wrap:wrap;">
      <a href="/clients/documents/upload/" class="btn-primary" style="display:inline-block; text-decoration:none;">Upload a Document</a>
      <a href="/clients/kyc/documents/" class="btn-small" style="display:inline-block; text-decoration:none;">Submit Passport / Proof of Address</a>
    </div>

    <div class="card">
      <div id="docsContent">
        <p style="color:var(--gray-light); font-size:0.875rem;">Loading…</p>
      </div>
    </div>
  </main>

    <script src="/clients/assets/portal.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', window.mcLogout);
    (async function init() {
      var session = await window.mcRequireSession('/clients/documents/');
      if (!session) return;
      var content = document.getElementById('docsContent');
      var docs = [];
      try { docs = (await window.mcApi('/client/documents')).documents || []; }
      catch (err) { content.innerHTML = '<div class="alert error">' + window.mcEscape(err.message) + '</div>'; return; }
      if (docs.length === 0) {
        content.innerHTML = '<p style="color:var(--gray-light); font-size:0.875rem;">No documents have been shared with you yet.</p>';
        return;
      }
      var rows = '';
      docs.forEach(function (d) {
        rows += '<tr>' +
          '<td>' + window.mcEscape(d.title) + '</td>' +
          '<td style="text-transform:capitalize;">' + window.mcEscape(String(d.category || '').replace(/_/g, ' ')) + '</td>' +
          '<td>' + new Date(d.uploaded_at).toLocaleDateString() + '</td>' +
          '<td><a href="' + window.mcFileUrl(d.storage_path, true) + '">Download</a></td>' +
        '</tr>';
      });
      content.innerHTML = '<table class="simple-table"><thead><tr><th>Title</th><th>Category</th><th>Date</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    })();
  </script>
</body>
</html>
